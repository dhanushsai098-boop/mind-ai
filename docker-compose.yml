version: "3.8"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: mindai-db
    restart: always
    environment:
      POSTGRES_USER: mindai
      POSTGRES_PASSWORD: mindai
      POSTGRES_DB: mindai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindai -d mindai"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mindai-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY:-fc598c7880ef5b42cf4b3c5ed8a39995772f4f83c2cf57245288972214b95826}
      DATABASE_URL: postgresql+psycopg://mindai:mindai@db:5432/mindai
      FRONTEND_URL: http://localhost:3000
      PORT: 8000
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mindai-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
      PORT: 3000
    depends_on:
      - backend

volumes:
  pgdata:
