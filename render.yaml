services:
  - type: web
    name: mind-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python init_db.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mindai-postgres
          property: connectionString
      - key: FRONTEND_URL
        value: https://mind-ai-liart.vercel.app
      - key: COOKIE_SECURE
        value: "true"
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: mind-ai-storage
      - key: R2_ENDPOINT_URL
        sync: false

databases:
  - name: mindai-postgres
    databaseName: mindai
    user: mindai
    plan: free
